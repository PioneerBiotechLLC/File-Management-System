# Every 15 minutes: batch reading left behind (finished batches in, waiting files out). Vercel's own cron
# on this project runs once a day, which is too slow for files waiting on a closed bulk page.
# Repository secrets (Settings > Secrets and variables > Actions): APP_URL, e.g.
# https://file-management-system-rho.vercel.app, and CRON_SECRET, the same value as in Vercel.
name: cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  batches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        run: |
          [ -n "$APP_URL" ] || { echo "::error::Repository secret APP_URL is not set"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repository secret CRON_SECRET is not set"; exit 1; }
      - name: Batch reading
        run: |
          curl -sS --fail-with-body --max-time 150 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/batches"
