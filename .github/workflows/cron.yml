# Every 15 minutes: batch reading left behind (finished batches in, waiting files out). Vercel's own cron
# on this project runs once a day, which is too slow for files waiting on a closed bulk page.
# Repository secrets (Settings > Secrets and variables > Actions): APP_URL, e.g.
# https://file-management-system-rho.vercel.app, and CRON_SECRET, the same value as in Vercel.
name: cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  batches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Batch reading
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Repository secrets APP_URL and CRON_SECRET are not set, so batch reading is only moved along when an admin opens Review. Add them under Settings > Secrets and variables > Actions."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/batches"
